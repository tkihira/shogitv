    <!-- Service Worker registered by an earlier deploy attempt — proactively unregister so
         users coming back from a previous visit don't keep a stale SW around. Once shipped,
         this can be dropped. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
      }
    </script>
