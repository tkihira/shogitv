<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <title>shogi tv — lishogi 注目対局 + 評価値</title>
    <!-- coi-serviceworker injects COOP/COEP headers via a service worker so SharedArrayBuffer
         (= YaneuraOu.wasm threading) works on hosts that can't set custom HTTP headers,
         notably GitHub Pages. The SW registers, then reloads the page once so the next load
         is cross-origin isolated. -->
    <script src="./coi-serviceworker.js"></script>
    <!-- iOS Safari sometimes leaves the SW in a half-broken state across reloads (registered
         but not controlling, or active but not actually intercepting fetches) where
         crossOriginIsolated stays false and the engine fails with
         "Can't find variable: SharedArrayBuffer". Recover by unregistering all SWs and
         reloading. Two guards keep this from looping forever or fighting coi-serviceworker:
           (a) only act when SWs are already registered — on a fresh visit the count is 0
               and we let coi-serviceworker do its normal register-then-reload dance
           (b) cap retries at 3 via sessionStorage; after that, give up and let the app
               surface the engine-error banner. -->
    <script>
      (function () {
        if (typeof SharedArrayBuffer !== 'undefined') {
          sessionStorage.removeItem('coi-recovery');
          return;
        }
        if (!('serviceWorker' in navigator)) return;
        var tries = parseInt(sessionStorage.getItem('coi-recovery') || '0', 10);
        if (tries >= 3) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          // Fresh visit (no SWs yet) → leave it to coi-serviceworker, no recovery needed.
          if (regs.length === 0) return;
          // Stuck state: SW exists but the page is not isolated. Force-recover.
          sessionStorage.setItem('coi-recovery', String(tries + 1));
          Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () { location.reload(); });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
